[package]
name = "stow"
version = "0.1.0"
edition = "2021"
description = "A local-first Git workspace registry"

[lib]
name = "stow_core"

[[bin]]
name = "stow"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[dependencies]
# Descriptor-relative filesystem operations and process-group cancellation.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"
